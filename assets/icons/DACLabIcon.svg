<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer Connector Pins (Gold) -->
  <g stroke="#FFCA28" stroke-width="3" stroke-linecap="round">
    <path d="M16 8 V2 M24 8 V2 M32 8 V2 M40 8 V2 M48 8 V2"/>
    <path d="M16 56 V62 M24 56 V62 M32 56 V62 M40 56 V62 M48 56 V62"/>
    <path d="M8 16 H2 M8 24 H2 M8 32 H2 M8 40 H2 M8 48 H2"/>
    <path d="M56 16 H62 M56 24 H62 M56 32 H62 M56 40 H62 M56 48 H62"/>
  </g>
  
  <!-- Base Microchip (Vibrant Blue) -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  
  <!-- Inner Circuit Grid (Bright Cyan/White) -->
  <g stroke="#E3F2FD" stroke-width="1.5" opacity="0.8">
    <line x1="24" y1="14" x2="24" y2="50"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="40" y1="14" x2="40" y2="50"/>
    <line x1="14" y1="24" x2="50" y2="24"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="14" y1="40" x2="50" y2="40"/>
  </g>
  
  <!-- Programmable Interconnect Nodes (Gold) -->
  <circle cx="24" cy="24" r="2.5" fill="#FFCA28"/>
  <circle cx="40" cy="24" r="2.5" fill="#FFCA28"/>
  <circle cx="24" cy="40" r="2.5" fill="#FFCA28"/>
  <circle cx="40" cy="40" r="2.5" fill="#FFCA28"/>
  
  <!-- Central Processing Core (White & Gold) -->
  <rect x="28" y="28" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#FFCA28" stroke-width="2"/>
</svg>
